<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b60"><title>因子管家</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#19332f;font:16px system-ui,-apple-system,sans-serif}header{background:#176b60;color:white;padding:25px 18px 22px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.9;font-size:13px}.wrap{max-width:680px;margin:auto;padding:15px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #1232}h2{font-size:18px;margin:0 0 14px}.stat{font-size:29px;font-weight:750;color:#176b60}.muted{color:#70807d;font-size:13px}label{display:block;font-size:14px;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8d5;border-radius:10px;background:white;color:#19332f;font:inherit}textarea{min-height:65px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:12px 15px;background:#176b60;color:white;font-weight:700;font-size:15px;cursor:pointer}.btn.secondary{background:#e4efec;color:#176b60}.btn.danger{background:#fbe9e7;color:#a32e22}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.item{border-top:1px solid #e5eeeb;padding:12px 0}.item:first-child{border-top:0}.itemtop{display:flex;justify-content:space-between;gap:8px}.pill{background:#e6f4ee;color:#176b60;padding:3px 9px;border-radius:20px;font-size:12px}.warn{color:#a14b18;font-size:13px;line-height:1.6}.hidden{display:none}button:focus,input:focus{outline-color:#176b60}</style></head><body><header><div style="max-width:680px;margin:auto"><h1>💚 因子管家</h1><p>记录每一次注射 · 管理因子库存 · 数据仅保存在本机</p></div></header><main class="wrap"><section class="card"><h2>当前库存</h2><div><span id="stock" class="stat">0</span> IU</div><div class="muted" id="bottles">瓶数：未设置</div><div class="actions"><button class="btn secondary" id="adjustBtn">调整 / 入库</button></div></section><section class="card"><h2>新增注射记录</h2><form id="recordForm"><label for="date">注射日期</label><input type="date" id="date" required><div class="grid"><div><label for="dose">剂量（IU）</label><input type="number" id="dose" min="1" step="1" inputmode="numeric" required placeholder="如 1500"></div><div><label for="type">注射类型</label><select id="type"><option>预防</option><option>出血补打</option></select></div></div><label for="note">备注（可选）</label><textarea id="note" placeholder="例如：左膝不适、注射时间等"></textarea><div class="actions"><button class="btn" type="submit">保存记录并扣减库存</button></div></form></section><section class="card"><h2>注射历史</h2><div class="grid"><div><label for="filter">筛选</label><select id="filter"><option value="全部">全部</option><option>预防</option><option>出血补打</option></select></div><div><label for="month">月份</label><input type="month" id="month"></div></div><div id="history"></div></section><section class="card"><h2>数据备份与恢复</h2><p class="muted">换手机、清除浏览器数据前，请先导出备份文件。建议每周备份一次。</p><div class="actions"><button class="btn secondary" id="exportBtn">导出备份 JSON</button><button class="btn secondary" id="importBtn">导入备份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json"></div><p class="warn">重要：本工具不是医疗建议或出血急救工具。库存允许显示负数以提示补录；请按医生制定的方案用药。浏览器无痕模式、清理网站数据或更换手机可能导致记录丢失。</p></section></main><dialog id="stockDialog" style="border:0;border-radius:16px;max-width:calc(100vw - 32px);width:420px;padding:22px"><form id="stockForm"><h2>库存调整 / 入库</h2><label for="stockMode">操作</label><select id="stockMode"><option value="add">入库（增加库存）</option><option value="set">盘点（设为指定库存）</option></select><label for="stockAmount">库存数量（IU）</label><input id="stockAmount" type="number" min="0" step="1" required inputmode="numeric"><label for="stockBottles">当前瓶数（可选，手动盘点）</label><input id="stockBottles" type="number" min="0" step="1" inputmode="numeric" placeholder="留空则不修改"><div class="actions"><button class="btn" type="submit">确认</button><button class="btn secondary" id="closeDialog" type="button">取消</button></div></form></dialog><script>
(()=>{'use strict';const KEY='factor_manager_v1';const $=id=>document.getElementById(id);let data;function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.records)&&Number.isFinite(v.stock)){return {stock:v.stock,bottles:v.bottles??null,records:v.records}}}catch(e){}return {stock:0,bottles:null,records:[]}}data=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存失败：浏览器可能禁用了本地存储，请先导出备份。');return false}}function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){$('stock').textContent=data.stock.toLocaleString('zh-CN');$('bottles').textContent=data.bottles===null?'瓶数：未设置（需手动盘点）':'瓶数：'+data.bottles+' 瓶（手动盘点）';const type=$('filter').value,month=$('month').value;const list=data.records.filter(r=>(type==='全部'||r.type===type)&&(!month||r.date.startsWith(month))).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));$('history').innerHTML=list.length?list.map(r=>`<div class="item"><div class="itemtop"><strong>${escapeHTML(r.date)} · ${Number(r.dose).toLocaleString('zh-CN')} IU</strong><span class="pill">${escapeHTML(r.type)}</span></div>${r.note?`<div style="margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(r.note)}</div>`:''}<div class="actions"><button class="btn danger" type="button" data-delete="${escapeHTML(r.id)}">删除并返还库存</button></div></div>`).join(''):'<p class="muted">暂无记录</p>'}$('date').value=today();$('recordForm').addEventListener('submit',e=>{e.preventDefault();let dose=Number($('dose').value),date=$('date').value;if(!date||!Number.isSafeInteger(dose)||dose<=0)return alert('请输入有效的日期和正整数剂量');if(dose>data.stock&&!confirm('当前库存不足，保存后会显示负库存。仍要继续吗？'))return;let old=structuredClone(data);data.records.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),date,dose,type:$('type').value,note:$('note').value.trim(),created:new Date().toISOString()});data.stock-=dose;if(!save()){data=old;return}e.target.reset();$('date').value=today();render();alert('记录已保存')});$('history').addEventListener('click',e=>{let b=e.target.closest('[data-delete]');if(!b)return;let i=data.records.findIndex(r=>r.id===b.dataset.delete);if(i<0||!confirm('确定删除这条注射记录并返还相应 IU 库存吗？'))return;let old=structuredClone(data);data.stock+=Number(data.records[i].dose);data.records.splice(i,1);if(!save()){data=old;return}render()});$('adjustBtn').onclick=()=>{$('stockAmount').value='';$('stockBottles').value=data.bottles??'';$('stockDialog').showModal()};$('closeDialog').onclick=()=>$('stockDialog').close();$('stockForm').onsubmit=e=>{e.preventDefault();let n=Number($('stockAmount').value),bs=$('stockBottles').value;if(!Number.isSafeInteger(n)||n<0||bs!==''&&(!Number.isSafeInteger(Number(bs))||Number(bs)<0))return alert('请输入有效的非负整数');let old=structuredClone(data);data.stock=$('stockMode').value==='add'?data.stock+n:n;if(bs!=='')data.bottles=Number(bs);if(!save()){data=old;return}$('stockDialog').close();render()};$('filter').onchange=render;$('month').onchange=render;$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'因子管家',version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='因子管家备份_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.records)||!Number.isSafeInteger(v.stock)||v.records.length>100000||!v.records.every(r=>typeof r.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isSafeInteger(r.dose)&&r.dose>0&&['预防','出血补打'].includes(r.type)&&typeof r.note==='string'&&typeof r.created==='string')||!(v.bottles===null||v.bottles===undefined||Number.isSafeInteger(v.bottles)&&v.bottles>=0))throw Error('备份格式不正确');if(!confirm('导入将覆盖当前全部记录与库存。请确认已备份当前数据。继续吗？'))return;let old=structuredClone(data);data={stock:v.stock,bottles:v.bottles??null,records:v.records};if(!save()){data=old;return}render();alert('恢复成功')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
